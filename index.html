<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#080c14',
              surface: 'rgba(18, 24, 38, 0.72)',
              surfaceElevated: 'rgba(26, 35, 54, 0.85)',
              blue: '#007AFF',
              cyan: '#00d2ff',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9F0A',
              purple: '#AF52DE',
              border: 'rgba(255, 255, 255, 0.08)',
              borderHighlight: 'rgba(255, 255, 255, 0.18)'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

  <!-- Interactive Falling Snow Orbs Canvas -->
  <canvas id="snow-canvas"></canvas>

  <!-- Ambient glowing depth gradients -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Main Responsive Container (Mobile-first, max-width: 480px) -->

      <!-- Quick Social Icons Row -->
      <div class="flex items-center justify-center gap-3 pt-4 border-t border-white/10 mb-3">

          class="p-2.5 rounded-full bg-white/5 border border-white/10 text-gray-300 hover:text-pink-500 hover:bg-pink-500/10 hover:border-pink-500/30 transition-all duration-200" title="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
          </svg>
        </a>

        <!-- Telegram -->
        <a href="https://t.me/Raouf_18" target="_blank" rel="noopener noreferrer"

          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 2-7 20-4-9-9-4Z"/>

        </div>
        <div class="flex items-center space-x-2 pl-2">
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-blue-400 group-hover:translate-x-1.5 transition-all"></i>

          <div class="min-w-0">
            <div class="flex items-center space-x-2">

            </div>
            <p class="link-desc text-xs text-slate-400 truncate mt-0.5">roofraafet@gmail.com</p>
          </div>
        </div>
        <div class="flex items-center space-x-2 pl-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500 group-hover:text-blue-400 group-hover:translate-x-1.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Toast Notification placeholder -->
  <div id="toast-container">
    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
    <span>Copied profile link!</span>
  </div>
  <!-- Scripts -->
  <script src="js/snow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
