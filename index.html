<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام الاحترافية | Professional Todo App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- خلفية متحركة -->
    <div class="background-animation">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
        <div class="floating-circle circle-4"></div>
    </div>

    <!-- الهيدر -->
    <header class="header">
        <div class="header-content">
            <h1 class="header-title">
                <i class="fas fa-tasks"></i>
                Raouf
            </h1>
            <button class="settings-btn" id="settingsBtn">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <div class="container">
            <!-- إحصائيات المهام -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">إجمالي المهام</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeTasks">0</div>
                    <div class="stat-label">المهام النشطة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">المهام المكتملة</div>
                </div>
            </div>

            <!-- إضافة مهمة جديدة -->
            <div class="add-task-container">
                <div class="add-task-form">
                    <input type="text" id="taskInput" placeholder="أضف مهمة جديدة..." class="task-input">
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">أولوية منخفضة</option>
                        <option value="medium">أولوية متوسطة</option>
                        <option value="high">أولوية عالية</option>
                    </select>
                    <button id="addTaskBtn" class="add-task-btn">
                        <i class="fas fa-plus"></i>
                        إضافة
                    </button>
                </div>
            </div>

            <!-- فلاتر المهام -->
            <div class="filters-container">
                <button class="filter-btn active" data-filter="all">جميع المهام</button>
                <button class="filter-btn" data-filter="active">النشطة</button>
                <button class="filter-btn" data-filter="completed">المكتملة</button>
            </div>

            <!-- قائمة المهام -->
            <div class="tasks-container" id="tasksContainer">
                <!-- المهام ستظهر هنا -->
            </div>
        </div>
    </main>

    <!-- زر الإعدادات العائم -->
    <button class="floating-settings-btn" id="floatingSettingsBtn">
        <i class="fas fa-palette"></i>
    </button>

    <!-- لوحة التخصيص -->
    <div class="customization-panel" id="customizationPanel">
        <div class="panel-header">
            <h3>تخصيص التطبيق</h3>
            <button class="close-panel-btn" id="closePanelBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="panel-content">
            <!-- الثيمات المحددة -->
            <div class="setting-group">
                <h4>الثيمات المحددة</h4>
                <div class="theme-options">
                    <button class="theme-btn active" data-theme="dark">
                        <div class="theme-preview dark-theme"></div>
                        داكن
                    </button>
                    <button class="theme-btn" data-theme="purple">
                        <div class="theme-preview purple-theme"></div>
                        بنفسجي
                    </button>
                    <button class="theme-btn" data-theme="blue">
                        <div class="theme-preview blue-theme"></div>
                        أزرق
                    </button>
                </div>
            </div>

            <!-- تخصيص الألوان -->
            <div class="setting-group">
                <h4>تخصيص الألوان</h4>
                <div class="color-inputs">
                    <div class="color-input-group">
                        <label>لون الخلفية</label>
                        <input type="color" id="bgColorPicker" value="#0a0a0a">
                    </div>
                    <div class="color-input-group">
                        <label>اللون الأساسي</label>
                        <input type="color" id="primaryColorPicker" value="#8b5cf6">
                    </div>
                </div>
            </div>

            <!-- حجم الخط -->
            <div class="setting-group">
                <h4>حجم الخط</h4>
                <div class="slider-container">
                    <input type="range" id="fontSizeSlider" min="12" max="20" value="16" class="slider">
                    <span id="fontSizeValue">16px</span>
                </div>
            </div>

            <!-- صورة الخلفية -->
            <div class="setting-group">
                <h4>صورة الخلفية</h4>
                <input type="file" id="backgroundImageInput" accept="image/*" class="file-input">
                <button id="removeBackgroundBtn" class="remove-bg-btn">إزالة الصورة</button>
            </div>

            <!-- الأنيميشن -->
            <div class="setting-group">
                <h4>الحركات والتأثيرات</h4>
                <label class="switch">
                    <input type="checkbox" id="animationToggle" checked>
                    <span class="switch-slider"></span>
                    تفعيل الحركات
                </label>
            </div>

            <!-- إعادة تعيين -->
            <div class="setting-group">
                <button id="resetSettingsBtn" class="reset-btn">
                    <i class="fas fa-undo"></i>
                    إعادة تعيين الإعدادات
                </button>
            </div>
        </div>
    </div>

    <!-- الخلفية المظلمة للوحة -->
    <div class="panel-overlay" id="panelOverlay"></div>

    <script src="script.js"></script>
</body>
</html>
